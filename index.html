<!doctype html>
<html lang="zh-CN">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="description" content="Volt-1 Sky Run 3D — fly an electric aerocar through a neon dusk city. Tilt your phone or use the keyboard.">
<title>Volt-1 Sky Run 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120f2a'/%3E%3Cpath d='M10 38c0-5 4-7 10-7 4-7 18-7 24 0 6 0 10 2 10 6 0 3-2 4-5 4H14c-3 0-4-1-4-3z' fill='%23eef1f7'/%3E%3Cellipse cx='20' cy='46' rx='6' ry='2.5' fill='%235fe3ff'/%3E%3Cellipse cx='44' cy='46' rx='6' ry='2.5' fill='%235fe3ff'/%3E%3C/svg%3E">

<style>
/* Layout: one-screen cockpit — header, 3D chase-cam viewport, control deck (beside the viewport on short landscape phones). Single dusk theme. */
:root {
  --night: #120f2a;
  --panel: #1c1838;
  --line: #352e5e;
  --pearl: #eef1f7;
  --muted: #a49fc7;
  --volt: #5fe3ff;
  --ember: #ff9a62;
  --danger: #ff5d73;
  --display: "Saira", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Arial Narrow", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--night); color: var(--pearl); font-family: var(--display); overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
button { font-family: inherit; }
.app {
  height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; max-width: 1200px; margin: 0 auto;
}
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
h1 { margin: 0; font-weight: 800; font-size: 1.6rem; letter-spacing: 0.02em; white-space: nowrap; }
h1 span { color: var(--volt); }
h1 em { font-style: normal; font-size: 0.7em; border: 1.5px solid var(--ember); color: var(--ember); border-radius: 5px; padding: 0 5px; margin-left: 4px; vertical-align: 0.2em; }
.tag { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.top-right { display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; }
.pill {
  font-weight: 700; font-size: 0.9rem; color: var(--pearl); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 40px;
}
.sound .eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.sound .eq i { width: 3px; background: var(--volt); border-radius: 1px; height: 4px; }
.sound[aria-pressed="true"] .eq i { animation: eq 0.9s ease-in-out infinite; }
.sound[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: -0.3s; }
.sound[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: -0.6s; }
.sound[aria-pressed="false"] { color: var(--muted); }
.sound[aria-pressed="false"] .eq i { background: var(--muted); }
@keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
@media (prefers-reduced-motion: reduce) { .sound .eq i { animation: none !important; height: 9px; } }
.modes { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.modes button {
  font-weight: 700; font-size: 0.9rem; color: var(--muted); background: transparent; border: 0; border-radius: 999px;
  padding: 5px 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.1;
}
.modes button small { font-family: var(--mono); font-weight: 400; font-size: 0.65rem; letter-spacing: 0.04em; }
.modes button[aria-pressed="true"] { background: var(--volt); color: var(--night); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.stage { position: relative; flex: 1; min-height: 200px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #2a1c4a; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {
  position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px;
  font-family: var(--mono); font-size: 0.75rem; pointer-events: none; font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px rgba(0,0,0,.7);
}
.hud div { display: flex; gap: 6px; align-items: center; }
.hud b { color: var(--muted); font-weight: 400; letter-spacing: 0.06em; }
.batt { width: 70px; height: 9px; border: 1px solid var(--pearl); border-radius: 2px; padding: 1px; position: relative; }
.batt::after { content: ""; position: absolute; right: -4px; top: 2px; width: 2px; height: 3px; background: var(--pearl); }
.batt i { display: block; height: 100%; background: var(--volt); width: 100%; }
.batt.low i { background: var(--danger); }
.tiltdot {
  position: absolute; left: 12px; bottom: 12px; width: 58px; height: 58px; border-radius: 50%;
  border: 1px solid rgba(238,241,247,.45); background: rgba(18,15,42,.35); pointer-events: none;
}
.tiltdot::before, .tiltdot::after { content: ""; position: absolute; background: rgba(238,241,247,.25); }
.tiltdot::before { left: 50%; top: 6px; bottom: 6px; width: 1px; }
.tiltdot::after { top: 50%; left: 6px; right: 6px; height: 1px; }
.tiltdot i { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--volt); box-shadow: 0 0 10px var(--volt); }
.toast {
  position: absolute; left: 50%; top: 44px; transform: translateX(-50%); max-width: calc(100% - 24px);
  background: rgba(28,24,56,.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px;
  font-size: 0.85rem; text-align: center; pointer-events: none; transition: opacity .3s;
}
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(18,15,42,.3); }
.card {
  background: rgba(28,24,56,.9); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 22px; max-width: 380px; text-align: center; display: grid; gap: 10px; backdrop-filter: blur(6px);
}
.card h2 { margin: 0; font-size: 1.5rem; font-weight: 800; }
.card p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
.card .score { font-family: var(--mono); color: var(--pearl); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.card .score:empty { display: none; }
.launch {
  justify-self: center; font-weight: 800; font-size: 1rem; letter-spacing: 0.04em;
  background: var(--volt); color: var(--night); border: 0; border-radius: 999px; padding: 10px 28px; cursor: pointer;
}
.fail { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); }

.deck { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.keys { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); display: grid; gap: 4px; min-width: 0; }
.keys kbd { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--pearl); }
.tiltbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.chip {
  font-size: 0.85rem; font-weight: 700; color: var(--pearl); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 12px; min-height: 36px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.chip[aria-pressed="true"] b { color: var(--volt); }
.chip[aria-pressed="false"] b { color: var(--muted); }
.chip input[type="range"] { width: 90px; accent-color: var(--volt); }
.chip input[type="checkbox"] { accent-color: var(--volt); width: 16px; height: 16px; margin: 0; }
.tilthint { width: 100%; font-size: 0.75rem; color: var(--muted); }
.pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 42px); gap: 5px; touch-action: none; margin-left: auto; }
.pad button { font-size: 1.15rem; color: var(--pearl); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; touch-action: none; padding: 0; }
.pad button.on { background: var(--volt); color: var(--night); border-color: var(--volt); }
.pad .hub { display: grid; place-items: center; font-family: var(--mono); font-size: 0.6rem; color: var(--muted); letter-spacing: .06em; }

@media (pointer: coarse) { .keys { display: none; } }
@media (max-width: 560px) {
  h1 { font-size: 1.3rem; }
  .tag { display: none; }
  .top-right { width: 100%; }
  .modes { flex: 1; }
  .modes button { flex: 1; padding: 5px 4px; }
  .keys { display: none; }
  .pad { margin: 0 auto; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 46px); }
}
/* short landscape phones: controls go beside the viewport */
@media (orientation: landscape) and (max-height: 520px) {
  .app { padding-block: 6px; gap: 6px; }
  h1 { font-size: 1.1rem; }
  .tag { display: none; }
  .top-right { width: auto; }
  .pill { min-height: 34px; padding: 4px 10px; }
  .modes button { padding: 3px 10px; }
  .modes button small { display: none; }
  .main { flex-direction: row; }
  .deck { flex-direction: column; justify-content: center; flex-wrap: nowrap; width: 190px; flex: none; }
  .tiltbox { justify-content: center; }
  .pad { margin: 0 auto; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 46px); }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Volt-1 <span>Sky Run</span><em>3D</em></h1>
      <span class="tag" data-i18n="tag"></span>
    </div>
    <div class="top-right">
      <div class="modes" role="group" id="modes">
        <button id="m-easy" data-mode="easy" aria-pressed="true"><span data-i18n="easy"></span><small data-i18n="way2"></small></button>
        <button id="m-medium" data-mode="medium" aria-pressed="false"><span data-i18n="medium"></span><small data-i18n="way4"></small></button>
        <button id="m-hard" data-mode="hard" aria-pressed="false"><span data-i18n="hard"></span><small data-i18n="way8"></small></button>
      </div>
      <button class="pill sound" id="sound" aria-pressed="true"><span class="eq"><i></i><i></i><i></i></span><span id="sound-label"></span></button>
      <button class="pill" id="lang" aria-label="Language / 语言"></button>
      <button class="pill" id="fs" hidden>⛶</button>
    </div>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud">
        <div><b data-i18n="alt"></b><span id="h-alt">0 m</span></div>
        <div><b data-i18n="spd"></b><span id="h-spd">0 km/h</span></div>
        <div><b data-i18n="dist"></b><span id="h-dist">0.00 km</span></div>
        <div><b data-i18n="batt"></b><span class="batt" id="h-batt"><i id="h-batt-fill"></i></span><span id="h-batt-pct">100%</span></div>
        <div><b data-i18n="best"></b><span id="h-best">0.00 km</span></div>
      </div>
      <div class="tiltdot" id="tiltdot" hidden><i id="tiltdot-i"></i></div>
      <div class="toast" id="toast" hidden></div>
      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="o-title"></h2>
          <p id="o-text"></p>
          <div class="score" id="o-score"></div>
          <button class="launch" id="launch"></button>
        </div>
      </div>
      <div class="fail" id="fail" hidden></div>
    </div>

    <div class="deck">
      <div class="keys" id="keys"></div>
      <div class="tiltbox" id="tiltbox" hidden>
        <button class="chip" id="tilt-toggle" aria-pressed="false"><span data-i18n="tilt"></span><b id="tilt-state"></b></button>
        <button class="chip" id="tilt-cal" data-i18n="recenter"></button>
        <label class="chip" for="tilt-sens"><span data-i18n="sens"></span><input type="range" id="tilt-sens" min="0.5" max="2" step="0.1" value="1"></label>
        <label class="chip" for="tilt-inv"><input type="checkbox" id="tilt-inv"><span data-i18n="invert"></span></label>
        <div class="tilthint" data-i18n="tiltHint"></div>
      </div>
      <div class="pad" id="pad"></div>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {

    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---------- language ----------
  const STR = {

      bestLine: '最佳 {b} km', scoreLine: '里程 {d} km  ·  最佳 {b} km',
      newBest: '{m}模式新纪录！', tryAgain: '再来一次吧，按空格、回车，或点"再飞一次"。',
      c_batt: '电量耗尽', c_ground: '触地坠毁', c_tower: '撞上大楼', c_sign: '撞上广告牌', c_bridge: '撞上空中天桥', c_drone: '撞上送货无人机',
      tilt: '体感', on: '开', off: '关', recenter: '校准', sens: '灵敏度', invert: '上下反转',
      tiltHint: '手机顶部朝自己倾斜 = 爬升，往外倾 = 下降；左右倾斜 = 转向。',
      recentered: '已校准', denied: '没有获得体感权限，已切换为按键操控。',
      noSensor: '没有检测到体感传感器，已切换为按键操控。', needHttps: '体感操控需要 https 网址。',
      noWebgl: '这个浏览器无法启动 3D 画面（WebGL），请换个浏览器或设备试试。',
      noThree: '3D 引擎没有加载成功，请刷新页面。',
      fly: '飞向', up: '上', down: '下', left: '左', right: '右',
      keys_easy: '<div><kbd>↑</kbd> <kbd>↓</kbd> 或 <kbd>W</kbd> <kbd>S</kbd> 爬升、下降</div><div>每道门会空出一层。<kbd>M</kbd> 静音。</div>',
      keys_medium: '<div><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>WASD</kbd></div><div>一次一个方向，以最后按下的键为准。<kbd>M</kbd> 静音。</div>',

  let lang = store.get('volt.lang', (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');

  // ---------- music + sound (synthesized live, original synthwave loop in A minor) ----------
  const Music = (() => {
    const BPM = { easy: 112, medium: 124, hard: 138 };
    const ROOTS = [45, 41, 36, 43];
    const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
    const LEAD = [
      69, null, 72, null, 76, null, 74, 72,
      72, null, 69, null, 65, null, 69, null,
      67, null, 72, null, 76, null, 79, 76,
      74, null, null, 71, null, 74, 76, null,
    ];
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    let ac, master, bus, filt, sfx, delay, noise;
    let step = 0, nextTime = 0, bpm = 112, playing = false;
    let enabled = store.get('volt.music', '1') === '1';
    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      master = ac.createGain(); master.gain.value = 0.55; master.connect(comp); comp.connect(ac.destination);
      filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = playing ? 16000 : 900; filt.Q.value = 0.8;
      bus = ac.createGain(); bus.gain.value = enabled ? 0.85 : 0; bus.connect(filt); filt.connect(master);
      sfx = ac.createGain(); sfx.gain.value = enabled ? 0.7 : 0; sfx.connect(master);
      delay = ac.createDelay(1); const fb = ac.createGain(), wet = ac.createGain();
      fb.gain.value = 0.38; wet.gain.value = 0.35;
      delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(bus);

  const streakMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, fog: false });
  const streakGeo = new THREE.BoxGeometry(0.03, 0.03, 4);

  function placeStreak(s, z) { const a = rnd(0, Math.PI * 2), r = rnd(5, 10); s.position.set(Math.cos(a) * r * 1.2, 6 + Math.sin(a) * r * 0.7, z); }
  for (let i = 0; i < 40; i++) { const s = new THREE.Mesh(streakGeo, streakMat); placeStreak(s, rnd(-120, 10)); scene.add(s); streaks.push(s); }

  // ---------- the Volt-1 ----------
  function buildCar() {
    const root = new THREE.Group(), body = new THREE.Group();
    root.add(body); body.rotation.y = Math.PI / 2;
    const s = 1 / 25, P = (x, y) => [x * s, -y * s];
    const shape = new THREE.Shape();
    shape.moveTo(...P(-48, 4));
    shape.bezierCurveTo(...P(-48, -6), ...P(-40, -9), ...P(-26, -10));
    shape.bezierCurveTo(...P(-12, -25), ...P(14, -25), ...P(27, -11));
    shape.bezierCurveTo(...P(39, -9), ...P(48, -6), ...P(51, 0));
    shape.bezierCurveTo(...P(51, 6), ...P(45, 9), ...P(37, 10));
    shape.lineTo(...P(-42, 10));
    shape.bezierCurveTo(...P(-47, 10), ...P(-48, 8), ...P(-48, 4));
    const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: 1.3, bevelEnabled: true, bevelThickness: 0.25, bevelSize: 0.14, bevelSegments: 5, curveSegments: 28 });
    bodyGeo.translate(0, 0, -0.65);

    const glass = new THREE.Shape();
    glass.moveTo(...P(-21, -10.5));

    glass.lineTo(...P(-21, -10.5));
    const glassGeo = new THREE.ExtrudeGeometry(glass, { depth: 1.62, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.08, bevelSegments: 3, curveSegments: 24 });
    glassGeo.translate(0, 0, -0.81);
    body.add(new THREE.Mesh(glassGeo, new THREE.MeshStandardMaterial({ color: 0x141a33, metalness: 0.9, roughness: 0.12 })));
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 1.5), new THREE.MeshBasicMaterial({ color: 0xc8f7ff }));
    head.position.set(2.02, 0.1, 0); body.add(head);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 1.7), new THREE.MeshBasicMaterial({ color: 0xff3d5a }));
    tail.position.set(-1.98, 0.17, 0); body.add(tail);
    const tailGlow = glow(0xff3d5a, 1.6, 0.8); tailGlow.position.set(-2.1, 0.17, 0); body.add(tailGlow);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.06), new THREE.MeshStandardMaterial({ color: 0xc9d0de, metalness: 0.4, roughness: 0.3 }));

    const podMat = new THREE.MeshStandardMaterial({ color: 0x2a2f45, metalness: 0.6, roughness: 0.4 });
    const podGeo = new THREE.CylinderGeometry(0.32, 0.28, 0.2, 20);
    const discMat = new THREE.MeshBasicMaterial({ color: 0x9ff4ff });
    const discGeo = new THREE.CircleGeometry(0.25, 20);
    const glows = [];
    for (const px of [-1.15, 1.1]) for (const pz of [-0.8, 0.8]) {
      const pod = new THREE.Mesh(podGeo, podMat); pod.position.set(px, -0.46, pz); body.add(pod);
      const disc = new THREE.Mesh(discGeo, discMat); disc.rotation.x = Math.PI / 2; disc.position.set(px, -0.57, pz); body.add(disc);
      const g = glow(0x5fe3ff, 1.4, 0.9); g.position.set(px, -0.75, pz); body.add(g); glows.push(g);
    }
    const under = new THREE.PointLight(0x5fe3ff, 1.6, 7); under.position.set(0, -1, 0); root.add(under);
    root.userData.glows = glows;

  const carMesh = buildCar(); scene.add(carMesh);

  // ---------- world ----------
  const XLIM = 5.1, YMIN = 1, YMAX = 11;
  let state = 'ready', tm = 0;
  let car, gates, drones, orbs, bits, dist, speed, battery, toNext, best, shake = 0;
  let overlayState = { kind: 'ready' };
  const colX = c => (c - 1) * CELL;
  const rowY = r => r * CELL + CELL / 2;

  function clearWorld() {
    for (const list of [gates, drones, orbs, bits]) if (list) for (const o of list) scene.remove(o.mesh);
    gates = []; drones = []; orbs = []; bits = [];
  }
  const bestKey = () => 'volt.best3d.' + mode;
  function reset() {
    clearWorld();
    car = { x: 0, y: 5, vx: 0, vy: 0, spin: 0, fall: 0 };
    dist = 0; speed = MODES[mode].speed; battery = 100; toNext = 0;
    best = parseFloat(store.get(bestKey(), '0')) || 0;
    carMesh.rotation.set(0, 0, 0);
  }

  function makeGate(z) {
    const open = new Set();
    if (mode === 'easy') {
      const rowsOpen = Math.random() < 0.35 ? 2 : 1;
      const rows = [0, 1, 2].sort(() => Math.random() - 0.5).slice(0, rowsOpen);
      for (const r of rows) for (let c = 0; c < 3; c++) open.add(r * 3 + c);
    } else {
      const n = mode === 'medium' ? (Math.random() < 0.5 ? 2 : 3) : (Math.random() < 0.6 ? 1 : 2);
      const cells = [...Array(9).keys()].sort(() => Math.random() - 0.5);
      for (let i = 0; i < n; i++) open.add(cells[i]);
    }
    const group = new THREE.Group(); group.position.z = z;
    const boxes = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      if (open.has(r * 3 + c)) continue;
      const x = colX(c), y = rowY(r);
      const mat = r === 0 ? towerCellMat : r === 1 ? bridgeMat : signBackMat;
      const m = new THREE.Mesh(cellGeo, mat); m.position.set(x, y, 0); group.add(m);
      const e = new THREE.LineSegments(cellEdges, r === 2 ? pinkEdge : cyanEdge); e.position.copy(m.position); group.add(e);
      if (r === 2) {
        const face = new THREE.Mesh(signFaceGeo, signMat(pick(STR[lang].signs))); face.position.set(x, y, DEPTH / 2 + 0.02); group.add(face);
        for (const cx of [-1.2, 1.2]) { const cb = new THREE.Mesh(cableGeo, bridgeMat); cb.position.set(x + cx, y + CELL / 2 - 0.05, 0); group.add(cb); }
      }
      boxes.push({ x0: x - CELL / 2 + 0.05, x1: x + CELL / 2 - 0.05, y0: y - CELL / 2 + 0.05, y1: y + CELL / 2 - 0.05 });
    }
    for (const px of [-6.4, 6.4]) {
      const p = new THREE.Mesh(pylonGeo, bridgeMat); p.position.x = px; group.add(p);
      const l = glow(0xff5d73, 1.2); l.position.set(px, 13.2, 0); l.userData.blink = true; group.add(l);
    }
    scene.add(group);
    gates.push({ mesh: group, boxes, passed: false });
    if (Math.random() < 0.6) { const cell = pick([...open]); addOrb(colX(cell % 3), rowY((cell / 3) | 0), z); }
  }
  const orbGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.7, 16);
  const capGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.12, 10);
  const orbMat = new THREE.MeshStandardMaterial({ color: 0x0f2a24, emissive: 0x9dffcf, emissiveIntensity: 0.9, metalness: 0.3, roughness: 0.4 });
  function addOrb(x, y, z) {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(orbGeo, orbMat));
    const cap = new THREE.Mesh(capGeo, orbMat); cap.position.y = 0.41; g.add(cap);
    g.add(glow(0x9dffcf, 2.4, 0.8));
    g.position.set(x, y, z); scene.add(g);
    orbs.push({ mesh: g, by: y });
  }
  const droneDark = new THREE.MeshStandardMaterial({ color: 0x2b2346, metalness: 0.5, roughness: 0.4 });
  const droneCargo = new THREE.MeshStandardMaterial({ color: 0xffb36b, roughness: 0.7 });
  const rotorMat = new THREE.MeshBasicMaterial({ color: 0xc8d2ff, transparent: true, opacity: 0.35 });
  function makeDrone(z) {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 0.9), droneDark));
    const cargo = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.5), droneCargo); cargo.position.y = -0.35; g.add(cargo);
    for (const dx of [-0.65, 0.65]) for (const dz of [-0.65, 0.65]) {

    }
    const eye = glow(0xff4d5e, 1.6); eye.position.set(0, 0, 0.5); g.add(eye);
    g.position.set(0, pick([2.5, 6, 9.5]) + rnd(-0.8, 0.8), z); scene.add(g);
    drones.push({ mesh: g, amp: rnd(3.5, 5), sp: rnd(1.1, 1.9), ph: rnd(0, 6.28) });
  }

  // ---------- wake lock + vibration ----------
  let wakeLock = null;
  async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch {} }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && state === 'playing') keepAwake(); });
  const buzz = ms => { try { navigator.vibrate?.(ms); } catch {} };

  function start() {
    if (state === 'playing') return;
    enableTilt();                 // inside the tap/key press, as iPhone requires
    tilt.needCalib = true;        // the current phone angle becomes center
    reset();
    state = 'playing';
    overlay.hidden = true;
    makeGate(-90);
    toNext = 90;
    Music.init(); Music.setPlaying(true); Music.launch();
    keepAwake();
  }
  function crash(reasonKey) {
    if (state !== 'playing') return;
    state = 'crashed'; shake = 0.6;
    Music.crash(); Music.setPlaying(false); buzz([80, 40, 160]);
    const colors = [0xffb36b, 0xff7a59, 0xfff1c7, 0x5fe3ff];
    for (let i = 0; i < 46; i++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), new THREE.MeshBasicMaterial({ color: pick(colors), transparent: true }));
      m.position.set(car.x, car.y, 0); scene.add(m);
      bits.push({ mesh: m, v: new THREE.Vector3(rnd(-9, 9), rnd(-4, 10), rnd(-8, 8)), life: rnd(0.6, 1.4), max: 1.4 });
    }
    const km = dist * 2 / 1000, newBest = km > best;
    if (newBest) { best = km; store.set(bestKey(), String(km)); }
    setTimeout(() => {

      renderOverlay();
      overlay.hidden = false;
    }, 1000);
  }

  // ---------- update ----------
  const HB = { x: 0.8, y: 0.42, z: 1.7 };
  function update(dt) {
    tm += dt;
    const m = MODES[mode];
    const ks = Math.min(1, dt * 12);
    tilt.x += (tilt.rawX - tilt.x) * ks; tilt.y += (tilt.rawY - tilt.y) * ks;
    let worldSpeed;
    if (state === 'playing') {
      speed = Math.min(m.max, speed + 0.35 * dt);
      worldSpeed = speed;
      dist += speed * dt;
      battery -= m.drain * dt;
      if (battery <= 0) { battery = 0; crash('c_batt'); }
      const inp = readInput();
      if (mode === 'hard') {
        car.vx += inp.dx * 32 * dt; car.vy += inp.up * 32 * dt;
        car.vy -= 8 * dt;
        const drag = Math.max(0, 1 - 1.9 * dt); car.vx *= drag; car.vy *= drag;
        const sp = Math.hypot(car.vx, car.vy); if (sp > 13) { car.vx *= 13 / sp; car.vy *= 13 / sp; }
      } else {
        const k = Math.min(1, dt * 10), v = 9.5;
        car.vx += (inp.dx * v - car.vx) * k; car.vy += (inp.up * v - car.vy) * k;
      }
      car.x += car.vx * dt; car.y += car.vy * dt;
      if (mode === 'easy') car.x += (0 - car.x) * Math.min(1, dt * 4);
      if (car.x < -XLIM) { car.x = -XLIM; car.vx = Math.max(0, car.vx); }
      if (car.x > XLIM) { car.x = XLIM; car.vx = Math.min(0, car.vx); }
      if (car.y > YMAX) { car.y = YMAX; car.vy = Math.min(0, car.vy); }
      if (car.y < YMIN) { car.y = YMIN; if (mode === 'hard') crash('c_ground'); else car.vy = Math.max(0, car.vy); }
      toNext -= speed * dt;
      if (toNext <= 0) {
        const gap = rnd(m.gap[0], m.gap[1]);
        makeGate(-170);
        if (mode === 'hard') makeDrone(-170 - gap / 2);
        toNext = gap;
      }
    } else if (state === 'ready') {
      worldSpeed = 14;
      car.x += (0 - car.x) * Math.min(1, dt * 3); car.vx = 0; car.vy = Math.cos(tm * 1.6) * 0.4;
      car.y = 5 + Math.sin(tm * 1.6) * 0.25;
    } else {
      speed *= Math.max(0, 1 - 8 * dt); worldSpeed = speed;
      car.fall += 14 * dt; car.y = Math.max(0.4, car.y - car.fall * dt); car.spin += dt * 6;
    }

    carMesh.position.set(car.x, car.y, 0);
    if (state === 'crashed') carMesh.rotation.set(car.spin * 0.3, car.spin, car.spin * 0.6);
    else {
      carMesh.rotation.x += (car.vy * 0.035 - carMesh.rotation.x) * Math.min(1, dt * 8);
      carMesh.rotation.z += (-car.vx * 0.06 - carMesh.rotation.z) * Math.min(1, dt * 8);
    }
    const thrust = state === 'crashed' ? 0 : 1.1 + Math.sin(tm * 40) * 0.12 + (state === 'playing' && readInput().up > 0 ? 0.5 : 0);
    for (const g of carMesh.userData.glows) g.scale.setScalar(thrust * 1.3);

    const dz = worldSpeed * dt;
    groundTex.offset.y += dz / 10;
    for (const b of city) { b.position.z += dz; if (b.position.z > 25) placeBuilding(b, b.position.z - 290); }
    for (const s of streaks) { s.position.z += dz * 1.6; if (s.position.z > 12) placeStreak(s, rnd(-130, -100)); }
    streakMat.opacity = state === 'playing' ? Math.min(0.5, Math.max(0, (speed - 18) / 40)) : 0.08;

    for (const g of gates) {
      g.mesh.position.z += dz;
      for (const c of g.mesh.children) if (c.userData.blink) c.visible = Math.sin(tm * 5 + g.mesh.position.z) > 0;
      if (state === 'playing' && Math.abs(g.mesh.position.z) < DEPTH / 2 + HB.z) {
        for (const b of g.boxes) {
          if (car.x + HB.x > b.x0 && car.x - HB.x < b.x1 && car.y + HB.y > b.y0 && car.y - HB.y < b.y1) {
            crash(b.y0 < 3 ? 'c_tower' : b.y0 > 7 ? 'c_sign' : 'c_bridge'); break;
          }
        }
      }
      if (!g.passed && g.mesh.position.z > HB.z + DEPTH) { g.passed = true; if (state === 'playing') Music.gate(); }
    }
    for (const d of drones) {
      d.mesh.position.z += dz;
      d.mesh.position.x = Math.sin(tm * d.sp + d.ph) * d.amp;
      d.mesh.rotation.z = -Math.cos(tm * d.sp + d.ph) * 0.25;
      if (state === 'playing') {
        const p = d.mesh.position;
        if (Math.abs(p.z) < HB.z + 0.6 && Math.abs(p.x - car.x) < HB.x + 0.7 && Math.abs(p.y - car.y) < HB.y + 0.45) crash('c_drone');
      }
    }
    for (const o of orbs) {
      o.mesh.position.z += dz;
      o.mesh.rotation.y += dt * 2.5;
      o.mesh.position.y = o.by + Math.sin(tm * 3 + o.mesh.position.z * 0.1) * 0.2;
      if (state === 'playing' && !o.got && o.mesh.position.distanceTo(carMesh.position) < 1.6) {
        o.got = true; battery = Math.min(100, battery + 16); Music.pickup(); buzz(20); scene.remove(o.mesh);
      }
    }
    for (const b of bits) {
      b.v.y -= 14 * dt; b.mesh.position.addScaledVector(b.v, dt); b.mesh.position.z += dz;
      b.life -= dt; b.mesh.material.opacity = Math.max(0, b.life / b.max);
      if (b.life <= 0) scene.remove(b.mesh);
    }
    const keep = o => { if (o.mesh.position.z > 20) { scene.remove(o.mesh); return false; } return true; };
    gates = gates.filter(keep); drones = drones.filter(keep);
    orbs = orbs.filter(o => !o.got && keep(o));
    bits = bits.filter(b => b.life > 0);

    const tx = car.x * 0.55, ty = car.y * 0.6 + 3.2;
    camera.position.x += (tx - camera.position.x) * Math.min(1, dt * 4);
    camera.position.y += (ty - camera.position.y) * Math.min(1, dt * 4);
    camera.position.z = 10.5;
    if (shake > 0) { shake -= dt; camera.position.x += rnd(-1, 1) * shake * 0.5; camera.position.y += rnd(-1, 1) * shake * 0.5; }
    camera.lookAt(car.x * 0.8, car.y * 0.85 + 0.6, -12);
    const targetFov = baseFov + (state === 'playing' ? (speed - 22) * 0.35 : 0);
    if (Math.abs(camera.fov - targetFov) > 0.05) { camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 2); camera.updateProjectionMatrix(); }
    sky.position.copy(camera.position);
    farField.position.set(camera.position.x, 0, camera.position.z);
  }

  // ---------- HUD + UI ----------
  const hAlt = $('h-alt'), hSpd = $('h-spd'), hDist = $('h-dist'), hBatt = $('h-batt'), hFill = $('h-batt-fill'), hPct = $('h-batt-pct'), hBest = $('h-best');
  const overlay = $('overlay'), oTitle = $('o-title'), oText = $('o-text'), oScore = $('o-score'), launchBtn = $('launch');

  // ---------- sizing + loop ----------
  let baseFov = 60;
  function resize() {
    const r = stage.getBoundingClientRect();
    if (!r.width || !r.height) return;
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / r.height;
    const hfov = 78 * Math.PI / 180;      // keep the 3-lane corridor in view on narrow screens
    baseFov = Math.max(58, Math.min(90, 2 * Math.atan(Math.tan(hfov / 2) / camera.aspect) * 180 / Math.PI));
    camera.fov = baseFov; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  addEventListener('orientationchange', () => { setTimeout(resize, 200); if (tilt.on) tilt.needCalib = true; });
  resize();
  camera.position.set(0, 6.2, 9.5);
  setMode(mode);
  overlayState = { kind: 'ready' };
  applyLang();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); renderer.render(scene, camera); hud(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
